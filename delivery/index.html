<meta name="theme-color" content="#4f0b1c"><title>البرنس فود | الدليفري</title><style data-inlined="style.css">*{box-sizing:border-box}body{margin:0;background:#f7f3ee;color:#25191b;font-family:Arial,"Tahoma",sans-serif}.header{height:74px;background:#4f0b1c;color:#fff;padding:0 max(18px,calc((100% - 900px)/2));display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:end;gap:7px}.brand b{font-size:22px}.brand small{color:#e6b44c;font-size:8px;letter-spacing:2px}.driver{display:flex;align-items:center;gap:8px}.driver .dot{width:9px;height:9px;background:#4fc48a;border-radius:50%;box-shadow:0 0 0 5px #4fc48a18}.driver div{display:grid}.driver b{font-size:11px}.driver small{font-size:8px;color:#ffffff88}.driver button{border:0;background:#ffffff12;color:#fff;border-radius:9px;width:34px;height:34px}.welcome,.stats,.section-head,.orders,.history{width:min(900px,calc(100% - 28px));margin-left:auto;margin-right:auto}.welcome{padding:35px 0 18px}.eyebrow{font-size:9px;letter-spacing:2px;color:#a26a3a;font-weight:900}.welcome h1{font-size:30px;margin:5px 0}.welcome p{margin:0;color:#8a7c78;font-size:12px}.welcome p b{color:#8a2840}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:32px}.stats>div{background:#fff;border:1px solid #eee3d9;border-radius:15px;padding:15px}.stats b{display:block;color:#8a2840;font-size:22px}.stats small{font-size:9px;color:#918581}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:13px}.section-head h2{font-size:19px;margin:2px 0}.refresh{border:1px solid #e6dcd4;background:#fff;border-radius:10px;width:36px;height:36px;color:#8a2840;cursor:pointer}.orders{display:grid;gap:12px}.order{background:#fff;border:1px solid #eee3d9;border-radius:18px;padding:17px;box-shadow:0 10px 25px #4f0b1c08}.order-top{display:flex;justify-content:space-between;align-items:start}.order-id{font-size:10px;color:#8f827e}.status{font-size:9px;font-weight:900;padding:5px 8px;border-radius:999px}.pickup{background:#fff0c8;color:#8c5a00}.route{background:#f7dce3;color:#97263f}.order h3{font-size:15px;margin:10px 0 2px}.order .address{font-size:10px;color:#8a7d78;margin-bottom:13px}.items{border-top:1px solid #eee7e1;border-bottom:1px solid #eee7e1;padding:9px 0;display:grid;gap:6px}.item{display:flex;justify-content:space-between;font-size:10px}.order-foot{display:flex;justify-content:space-between;align-items:center;margin-top:13px}.total{color:#8a2840;font-weight:900}.primary{border:0;background:#8a2840;color:#fff;border-radius:11px;padding:11px 15px;font-weight:900;cursor:pointer}.full{width:100%}.history{margin-top:34px;padding-bottom:35px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.summary div{background:#fff;border:1px solid #eee3d9;border-radius:14px;padding:14px}.summary span{display:block;font-size:9px;color:#918581}.summary b{font-size:14px}.modal{position:fixed;inset:0;background:#20080f99;display:grid;place-items:center;padding:15px;z-index:5}.modal-card{width:min(460px,100%);background:#fffdf9;border-radius:20px;padding:24px;position:relative}.modal-card>button:first-child{position:absolute;left:16px;top:16px;border:0;background:#f2e7de;border-radius:9px;width:34px;height:34px;font-size:22px;color:#8a2840}.modal-card h2{font-size:23px;margin:4px 0 16px}.modal-card p,.modal-card li{font-size:11px;color:#766967}.modal-card ul{padding-right:18px}.modal-card .primary{margin-top:15px}[hidden]{display:none!important}@media(max-width:520px){.header{padding:0 13px}.welcome{padding-top:27px}.welcome h1{font-size:26px}.stats{gap:7px}.stats>div{padding:12px 9px}.stats b{font-size:18px}.stats small{font-size:8px}.summary{grid-template-columns:1fr}.order{padding:14px}}

body{background:radial-gradient(circle at 80% 0%,#fff6e8 0,#f7f3ee 38%,#eee7e0 100%)}
.header{background:linear-gradient(100deg,#350613,#741329);box-shadow:0 12px 35px #4f0b1c25}.welcome{padding-top:45px}.welcome h1{font-family:Georgia,serif;font-size:34px}.stats>div,.order,.summary div{box-shadow:0 14px 35px #4f0b1c09;transition:.22s}.stats>div:hover,.order:hover,.summary div:hover{transform:translateY(-4px);box-shadow:0 22px 45px #4f0b1c13}.order{border-radius:22px}.primary{box-shadow:0 10px 25px #8a284033;transition:.2s}.primary:hover{transform:translateY(-2px);filter:brightness(1.05)}

.order-actions{display:flex;gap:8px;margin-top:12px}.contact-btn,.chat-btn{flex:1;text-align:center;border:1px solid #eadfd7;background:#fff7ef;color:#7a243a;border-radius:10px;padding:9px 8px;font-size:10px;font-weight:900;text-decoration:none;cursor:pointer}.chat-btn{background:#f7e7d8}.done{color:#2f8b63;font-size:10px;font-weight:900}.empty-order{text-align:center;padding:30px}.profile-menu{position:fixed;inset:0;background:#20080f66;display:grid;place-items:start end;padding:86px 18px;z-index:20}.profile-card{width:min(330px,calc(100vw - 36px));background:#fffdf9;border-radius:18px;padding:22px;box-shadow:0 25px 70px #0004;position:relative}.profile-card h2{margin:8px 0 4px;font-size:20px}.profile-card p{margin:0 0 18px;color:#8a7d78;font-size:11px}.profile-close{position:absolute;left:12px;top:12px;border:0;background:#f2e7de;border-radius:8px;width:32px;height:32px;color:#8a2840;font-size:20px}.chat-box{height:300px;overflow:auto;border:1px solid #eee3d9;border-radius:14px;padding:10px;background:#faf7f3;display:grid;align-content:start;gap:8px}.chat-bubble{max-width:82%;padding:9px 11px;border-radius:12px;background:#fff;border:1px solid #eee3d9;font-size:10px}.chat-bubble.mine{margin-right:auto;background:#f6e0e5;border-color:#edcbd4}.chat-bubble small{display:block;margin-top:4px;color:#9b8d88;font-size:8px}.chat-form{display:flex;gap:8px;margin-top:10px}.chat-form input{flex:1;border:1px solid #e3d8cf;border-radius:10px;padding:10px;font:inherit;outline:none}.chat-form .primary{margin:0}.chat-empty{text-align:center;color:#9a8e8a;font-size:10px;padding:40px 10px}
</style>
<style data-inlined="auth.css">
.auth-gate{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at top,#68152c 0,#260710 42%,#120306 100%);display:grid;place-items:center;padding:18px}.auth-card{width:min(430px,100%);background:#fffdf9;border-radius:24px;padding:30px;box-shadow:0 30px 80px #0008}.auth-logo{font-size:25px;font-weight:900;color:#4f0b1c}.auth-logo small{font-size:8px;color:#b27631;letter-spacing:2px;margin-right:5px}.auth-eyebrow{display:block;margin-top:28px;font-size:9px;letter-spacing:2px;color:#a26a3a;font-weight:900}.auth-card h1{font-size:27px;margin:5px 0}.auth-sub{font-size:11px;color:#887b77;margin:0 0 20px}.auth-card form{display:grid;gap:12px}.auth-card label{display:grid;gap:6px;font-size:10px;font-weight:800;color:#584b48}.auth-card input{width:100%;border:1px solid #e3d8cf;background:#fff;border-radius:11px;padding:12px;font:inherit;outline:none}.auth-card input:focus{border-color:#8a2840;box-shadow:0 0 0 3px #8a284015}.auth-submit{border:0;border-radius:11px;padding:13px;background:#8a2840;color:#fff;font-weight:900;cursor:pointer}.auth-switch{border:0;background:transparent;color:#8a2840;font-size:10px;font-weight:900;cursor:pointer}.auth-msg{min-height:18px;text-align:center;font-size:10px;color:#5e7770}.auth-msg.error{color:#a12843}.auth-gate[hidden]{display:none!important}
</style>
</head>
<body>
<div class="auth-gate" id="authGate" hidden></div>
<header class="header"><div class="brand"><b>البرنس</b><small>FOOD</small></div><div class="driver"><span class="dot"></span><div><b id="driverName">مندوب الدليفري</b><small>مندوب توصيل</small></div><button id="profile" type="button" aria-label="حسابي">•••</button></div></header>
<main>
<section class="welcome"><span class="eyebrow">DELIVERY APP</span><h1 id="welcomeTitle">أهلاً بيك 👋</h1><p id="welcomeText">بنراجع الطلبات المسندة ليك لحظيًا.</p></section>
<div class="stats"><div><b id="todayCount">0</b><small>طلبات اليوم</small></div><div><b id="activeCount">0</b><small>طلبات نشطة</small></div><div><b id="deliveredCount">0</b><small>تم التسليم اليوم</small></div></div>
<div class="section-head"><div><span class="eyebrow">ACTIVE ORDERS</span><h2>طلباتك الحالية</h2></div><button class="refresh" id="refresh">↻</button></div>
<section id="deliveryOrders" class="orders"></section>
<section class="history"><div class="section-head"><div><span class="eyebrow">TODAY</span><h2>ملخص اليوم</h2></div></div><div class="summary"><div><span>طلبات اليوم</span><b id="summaryToday">0</b></div><div><span>تم التسليم</span><b id="summaryDelivered">0</b></div><div><span>قيمة الطلبات المسلّمة</span><b id="summaryTotal">0 ج</b></div></div></section>
</main>
<div class="modal" id="modal" hidden><div class="modal-card"><button id="close">×</button><span class="eyebrow">ORDER DETAILS</span><h2 id="modalTitle"></h2><div id="modalBody"></div></div></div>
<div class="profile-menu" id="profileMenu" hidden><div class="profile-card"><button class="profile-close" id="closeProfile">×</button><span class="eyebrow">MY ACCOUNT</span><h2 id="profileName">مندوب الدليفري</h2><p id="profileEmail">—</p><button class="primary full" id="logout">تسجيل الخروج</button></div></div>
